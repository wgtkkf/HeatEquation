name: C++20 CI pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Native Ubuntu Build
  build-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cpp
    steps:
      - uses: actions/checkout@v3

      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-13 

      - name: Build
        run: cmake --build build

      - name: Run Unit Tests
        run: |
          cd build
          ctest --output-on-failure

  # Job 2: The Docker Build
  build-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cpp
    steps:
      - uses: actions/checkout@v3

      - name: Build a Docker Image
        run: docker build -t FEMHeatEquation .

      - name: Run Unit Tests inside Docker
        run: docker run FEMHeatEquation
